<mat-card class="card">
  <h1>Lichess To Tornelo Converter</h1>
  <mat-form-field>
    <mat-label>Lichess Tournament Code</mat-label>
    <input matInput type="text" [(ngModel)]="value">
    @if (value) {
      <button matSuffix mat-icon-button aria-label="Clear" (click)="GetPGN()">
        <mat-icon>download</mat-icon>
      </button>
    }
  </mat-form-field>
</mat-card>
